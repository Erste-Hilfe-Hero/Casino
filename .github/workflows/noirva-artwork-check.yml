name: NOIRVA artwork acceptance
on:
  push:
    branches: [feat/hero-casino-rebrand]
    paths:
      - 'web/**'
      - 'tests/visual/noirva_artwork_check.py'
      - '.github/workflows/noirva-artwork-check.yml'
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator and Chromium
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Inspect all game artwork and Eclipse controls
        run: python tests/visual/noirva_artwork_check.py --output scratch/noirva-fantasy
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noirva-fantasy-browser-evidence
          path: scratch/noirva-fantasy
          retention-days: 30
