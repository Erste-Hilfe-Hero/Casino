name: Apply HERO Casino rebranding
on:
  push:
    branches: [feat/hero-casino-rebrand]
    paths: [.github/workflows/apply-hero.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-casino-rebrand
          fetch-depth: 0
      - name: Apply verified local changes
        run: |
          set -euo pipefail
          git apply --check .github/hero-rebrand.patch
          git apply --index .github/hero-rebrand.patch
          git rm .github/hero-rebrand.patch
          python scripts/validate_versions.py
          python scripts/validate_game_catalog.py
          python scripts/validate_requirements.py
          python scripts/validate_contracts.py
          python scripts/validate_module_boundaries.py
          python scripts/generate_docs.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebrand as black HERO Casino with original artwork for all 46 games"
          git push origin HEAD:feat/hero-casino-rebrand
